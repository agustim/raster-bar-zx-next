name: Build NEX

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install build dependencies (for compiling sjasmplus)
        run: |
          sudo apt-get update
          sudo apt-get install -y make g++

      - name: Generate data files and assemble the NEX
        run: ./build.sh

      - name: Verify output
        run: |
          test -f src/build/rasterbar.nex
          echo "NEX built: $(stat -c%s src/build/rasterbar.nex) bytes"

      - name: Attach NEX as workflow artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rasterbar-nex
          path: src/build/rasterbar.nex

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: src/build/rasterbar.nex
          generate_release_notes: true
